artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  # Point this at whichever Kaggle "next word prediction" text dataset you
  # choose. If you download it manually, just place the file at this exact
  # path (rename it if needed). Works with .txt (one line per training
  # sentence) or .csv (set text_column below to the column with the text).
  local_data_file: artifacts/data_ingestion/corpus.txt
  # Optional: set to "owner/dataset-slug" to auto-download via the Kaggle
  # API (requires KAGGLE_USERNAME / KAGGLE_KEY env vars and `pip install
  # kaggle`). Leave blank to just use a manually-placed local file.
  kaggle_dataset: ""
  # Only needed if local_data_file is a .csv -- name of the column with text.
  text_column: ""

data_transformation:
  root_dir: artifacts/data_transformation
  tokenizer_path: artifacts/data_transformation/tokenizer.pkl
  train_sequences_file: artifacts/data_transformation/train_sequences.npz
  test_sequences_file: artifacts/data_transformation/test_sequences.npz
  meta_file: artifacts/data_transformation/meta.json

model_trainer:
  root_dir: artifacts/model_trainer
  trained_model_path: artifacts/model_trainer/next_word_model.keras

model_evaluation:
  root_dir: artifacts/model_evaluation
  metric_file_name: artifacts/model_evaluation/metrics.json
